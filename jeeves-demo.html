document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"a6543f68-8a2c-4e89-943e-205eec4cb9c6\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;min-height:100%;}\n  body{background:#100D08;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}\n  button{font-family:inherit;}\n  #jv-root{\n    --bg:#F2EAD8;--card:#ffffff;--ink:#1A1208;--navy:#28231B;--navy2:#34302A;\n    --red:#AA0800;--accent:#C41200;--muted:#7A6A55;--green:#1f9d57;--line:#E0D0B8;\n    --chip:#F5ECE0;--chipline:#D4C4A8;--inputbg:#f6f9fc;--page:#100D08;--redbg:#ffe1e5;\n  }\n  #jv-root[data-theme=\"dark\"]{\n    --bg:#130F0A;--card:#211C15;--ink:#F0E8DA;--navy:#28231B;--navy2:#34302A;\n    --red:#AA0800;--accent:#E05040;--muted:#A8998A;--green:#4cc98a;--line:#3A3025;\n    --chip:#2A2318;--chipline:#3A3025;--inputbg:#1A1510;--page:#0a0806;--redbg:#3A2020;\n  }\n  @keyframes jv-blink{50%{opacity:.3;}}\n  @keyframes jv-pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}\n  @keyframes jv-playpulse{0%,100%{transform:scale(1);box-shadow:0 12px 40px rgba(0,0,0,.45);}50%{transform:scale(1.06);box-shadow:0 16px 52px rgba(0,0,0,.55);}}\n  @keyframes jv-ring{0%,100%{box-shadow:0 0 0 4px rgba(196,18,0,.35),0 0 22px rgba(196,18,0,.5);}50%{box-shadow:0 0 0 10px rgba(196,18,0,0),0 0 22px rgba(196,18,0,.25);}}\n  @keyframes jv-bannerflash{0%,100%{background:linear-gradient(90deg,#AA0800,#C41200);}50%{background:linear-gradient(90deg,#E8A200,#FF7A00);}}\n  @keyframes jv-bannerbob{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}\n<\u002Fstyle>\n<script src=\"79e5c101-08fd-422a-a71e-eb97ae59a648\"><\u002Fscript>\n<\u002Fhelmet>\n<div id=\"jv-root\" data-theme=\"{{ theme }}\" style=\"min-height:100vh;box-sizing:border-box;background:var(--page);display:flex;flex-direction:column;align-items:stretch;\">\n\n  <sc-if value=\"{{ showEdgeBanner }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ onOpenInEdge }}\" title=\"Open this demo in Microsoft Edge\" style=\"position:sticky;top:0;z-index:200;min-width:100vw;display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;padding:11px 16px;font-size:13.5px;box-shadow:0 2px 16px rgba(0,0,0,.4);animation:jv-bannerflash 1.1s ease-in-out infinite;cursor:pointer;\">\n      <span style=\"font-size:16px;animation:jv-bannerbob 1.1s ease-in-out infinite;\">🎙<\u002Fspan>\n      <span style=\"font-weight:700;letter-spacing:.01em;\">{{ edgeBannerText }}<\u002Fspan>\n      <span style=\"background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:700;white-space:nowrap;\">Open in Edge ↗<\u002Fspan>\n      <button onclick=\"{{ onDismissEdge }}\" style=\"margin-left:4px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;\">{{ edgeDismissLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"min-width:max-content;box-sizing:border-box;display:flex;flex-direction:row;justify-content:center;align-items:flex-start;gap:22px;padding:24px 20px 40px;\">\n\n  <aside style=\"width:270px;flex:0 0 auto;position:sticky;top:24px;align-self:flex-start;max-height:calc(100vh - 48px);overflow:auto;background:#16110b;border:1px solid rgba(242,234,216,.1);border-radius:16px;padding:15px;display:flex;flex-direction:column;gap:12px;\">\n    <div style=\"display:flex;flex-direction:column;gap:2px;\">\n      <span style=\"color:#F2EAD8;font-size:14px;font-weight:800;letter-spacing:.02em;\">{{ navTitle }}<\u002Fspan>\n      <span style=\"color:#8a785f;font-size:10.5px;\">{{ navSub }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;\">\n      <button onclick=\"{{ onPrev }}\" title=\"Previous\" style=\"flex:1;background:rgba(242,234,216,.07);border:1px solid rgba(242,234,216,.12);color:#E3D2B8;border-radius:9px;padding:9px 0;font-size:13px;cursor:pointer;\">⏮<\u002Fbutton>\n      <button onclick=\"{{ onTransportPlay }}\" title=\"Play / pause\" style=\"flex:1.7;background:linear-gradient(135deg,#AA0800,#C41200);border:0;color:#fff;border-radius:9px;padding:9px 0;font-size:14px;font-weight:700;cursor:pointer;\">{{ playIcon }}<\u002Fbutton>\n      <button onclick=\"{{ onNext }}\" title=\"Next\" style=\"flex:1;background:rgba(242,234,216,.07);border:1px solid rgba(242,234,216,.12);color:#E3D2B8;border-radius:9px;padding:9px 0;font-size:13px;cursor:pointer;\">⏭<\u002Fbutton>\n      <button onclick=\"{{ onRestart }}\" title=\"Restart\" style=\"flex:1;background:rgba(242,234,216,.07);border:1px solid rgba(242,234,216,.12);color:#E3D2B8;border-radius:9px;padding:9px 0;font-size:14px;cursor:pointer;\">↻<\u002Fbutton>\n    <\u002Fdiv>\n    <button onclick=\"{{ onToggleAutoAdvance }}\" title=\"Hold on each stop\" style=\"{{ holdToggleStyle }}\">\n      <span style=\"{{ holdKnobStyle }}\"><\u002Fspan>\n      <span style=\"flex:1;text-align:left;\">{{ holdLabel }}<\u002Fspan>\n      <span style=\"font-size:13px;\">{{ holdIcon }}<\u002Fspan>\n    <\u002Fbutton>\n    <div style=\"background:rgba(242,234,216,.05);border:1px solid rgba(242,234,216,.08);border-radius:10px;padding:9px 11px;\">\n      <div style=\"font-size:9px;letter-spacing:.16em;color:#A08C6E;font-weight:700;\">{{ nowKicker }}<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#F2EAD8;margin-top:3px;font-weight:600;\">{{ nowLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ navSections }}\" as=\"sec\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid rgba(242,234,216,.07);padding-top:8px;\">\n        <button onclick=\"{{ sec.onToggle }}\" style=\"{{ sec.headerStyle }}
